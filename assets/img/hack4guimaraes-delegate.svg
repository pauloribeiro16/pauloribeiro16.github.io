<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#0f172a"/>
  <rect x="24" y="20" width="752" height="410" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>

  <text x="48" y="54" fill="#34d399" font-family="monospace" font-size="13" font-weight="bold">HACK4GUIMARÃES 2035 · DESAFIO «FALAR COM A CÂMARA SEM BUROCRACIA»</text>
  <text x="48" y="84" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold">Delegate (Henriques) — Representante Digital &amp; Porta Agêntica</text>

  <!-- 3 Columns -->
  <rect x="48" y="110" width="220" height="285" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="66" y="138" fill="#7dd3fc" font-family="monospace" font-size="12" font-weight="bold">1. MUNÍCIPE / EMPRESA</text>
  <text x="66" y="164" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">O «Henriques»</text>
  <text x="66" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="12">Representante Digital Pessoal</text>
  <text x="66" y="208" fill="#cbd5e1" font-family="sans-serif" font-size="12">com mandato explícito.</text>
  <rect x="66" y="228" width="184" height="145" rx="6" fill="#162235"/>
  <text x="78" y="252" fill="#93c5fd" font-family="sans-serif" font-size="11">• Trata da burocracia municipal</text>
  <text x="78" y="274" fill="#93c5fd" font-family="sans-serif" font-size="11">• Cita apenas fontes oficiais</text>
  <text x="78" y="296" fill="#6ee7b7" font-family="sans-serif" font-size="11">• Abstém-se quando não tem</text>
  <text x="78" y="314" fill="#6ee7b7" font-family="sans-serif" font-size="11">  fonte oficial verificada</text>
  <text x="78" y="338" fill="#fbbf24" font-family="sans-serif" font-size="11">• Pede confirmação humana nos</text>
  <text x="78" y="356" fill="#fbbf24" font-family="sans-serif" font-size="11">  atos vinculativos</text>

  <rect x="290" y="110" width="220" height="285" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="308" y="138" fill="#6ee7b7" font-family="monospace" font-size="12" font-weight="bold">2. PORTA AGÊNTICA (MCP)</text>
  <text x="308" y="164" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">Protocolo Governado</text>
  <text x="308" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="12">Interface aberta da Câmara para</text>
  <text x="308" y="208" fill="#cbd5e1" font-family="sans-serif" font-size="12">agentes dos cidadãos.</text>
  <rect x="308" y="228" width="184" height="145" rx="6" fill="#162235"/>
  <text x="320" y="252" fill="#6ee7b7" font-family="monospace" font-size="11">/api/porta/mcp.ts</text>
  <text x="320" y="274" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Submissão de plantas e</text>
  <text x="320" y="292" fill="#cbd5e1" font-family="sans-serif" font-size="11">  certidões (ex: esplanadas)</text>
  <text x="320" y="314" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Validação determinística de</text>
  <text x="320" y="332" fill="#cbd5e1" font-family="sans-serif" font-size="11">  requisitos antes da entrega</text>
  <text x="320" y="356" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Canal Telegram + Web</text>

  <rect x="532" y="110" width="220" height="285" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="550" y="138" fill="#fde68a" font-family="monospace" font-size="12" font-weight="bold">3. CÂMARA MUNICIPAL</text>
  <text x="550" y="164" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">Consola &amp; Mapa Cidade</text>
  <text x="550" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="12">Decisão humana onde é devida</text>
  <text x="550" y="208" fill="#cbd5e1" font-family="sans-serif" font-size="12">pelos técnicos municipais.</text>
  <rect x="550" y="228" width="184" height="145" rx="6" fill="#162235"/>
  <text x="562" y="252" fill="#fde68a" font-family="monospace" font-size="11">/api/consola/pedidos.ts</text>
  <text x="562" y="274" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Consola para os técnicos</text>
  <text x="562" y="292" fill="#cbd5e1" font-family="sans-serif" font-size="11">  com dossiê pré-validado</text>
  <text x="562" y="314" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Mapa de Intenções da cidade</text>
  <text x="562" y="332" fill="#cbd5e1" font-family="sans-serif" font-size="11">  em tempo real</text>
  <text x="562" y="356" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Auditoria completa de eventos</text>
</svg>
