<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#0b1528"/>
  <rect x="24" y="20" width="752" height="410" rx="14" fill="#111f38" stroke="#2c4875" stroke-width="1.5"/>

  <text x="48" y="54" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">PROMPT ENGINEERING LAB · INTEGRAÇÃO DE IA · PROMPT-AS-CODE</text>
  <text x="48" y="84" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold">Engenharia de Prompts Experimental &amp; Gates Humanas</text>

  <!-- Flow pipeline -->
  <rect x="48" y="108" width="218" height="125" rx="8" fill="#172a4a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="64" y="134" fill="#7dd3fc" font-family="monospace" font-size="12" font-weight="bold">1. FICHAS &amp; CONTEXT PACKS</text>
  <text x="64" y="158" fill="#e2e8f0" font-family="sans-serif" font-size="13">Packs K1–K4 determinísticos</text>
  <text x="64" y="178" fill="#94a3b8" font-family="monospace" font-size="11">PROM-P1-01 … PROM-P3</text>
  <text x="64" y="198" fill="#94a3b8" font-family="monospace" font-size="11">prompt_digests em config.json</text>
  <text x="64" y="218" fill="#38bdf8" font-family="sans-serif" font-size="11">Zero sumarização com perda</text>

  <rect x="291" y="108" width="218" height="125" rx="8" fill="#172a4a" stroke="#a855f7" stroke-width="1.5"/>
  <text x="307" y="134" fill="#d8b4fe" font-family="monospace" font-size="12" font-weight="bold">2. PARSERS L0 &amp; REPARO</text>
  <text x="307" y="158" fill="#e2e8f0" font-family="sans-serif" font-size="13">Contrato de forma explícito</text>
  <text x="307" y="178" fill="#94a3b8" font-family="monospace" font-size="11">1 ronda de reparo guiado</text>
  <text x="307" y="198" fill="#94a3b8" font-family="monospace" font-size="11">Validador L1 (zero-LLM)</text>
  <text x="307" y="218" fill="#d8b4fe" font-family="sans-serif" font-size="11">Trace integral em trace.jsonl</text>

  <rect x="534" y="108" width="218" height="125" rx="8" fill="#172a4a" stroke="#10b981" stroke-width="1.5"/>
  <text x="550" y="134" fill="#6ee7b7" font-family="monospace" font-size="12" font-weight="bold">3. HUMAN DECISION GATES</text>
  <text x="550" y="158" fill="#e2e8f0" font-family="sans-serif" font-size="13">IA integra, humano decide</text>
  <text x="550" y="178" fill="#94a3b8" font-family="monospace" font-size="11">G-P1-A · G-P1-B · G-P1-C · G-P1-D</text>
  <text x="550" y="198" fill="#94a3b8" font-family="monospace" font-size="11">steps/gates/*.approved</text>
  <text x="550" y="218" fill="#6ee7b7" font-family="sans-serif" font-size="11">Assinatura de risco pelo analista</text>

  <!-- Empirical Prompt Findings -->
  <rect x="48" y="254" width="704" height="154" rx="10" fill="#0d182c" stroke="#334155" stroke-width="1.5"/>
  <text x="68" y="282" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold">DESCOBERTAS EMPÍRICAS DE PROMPT ENGINEERING (LAB OVERLAYS)</text>

  <text x="68" y="312" fill="#f8fafc" font-family="monospace" font-size="13">• Regra vs. Menu (EXP-01):</text>
  <text x="295" y="312" fill="#cbd5e1" font-family="sans-serif" font-size="13">1 linha de regra de calibração subiu os ajustes contextualizados de 1/65 para 17/65.</text>

  <text x="68" y="342" fill="#f8fafc" font-family="monospace" font-size="13">• Partição Explícita (M03):</text>
  <text x="295" y="342" fill="#cbd5e1" font-family="sans-serif" font-size="13">Dar forma vazia legal em PROM-P1-03 v1.2 reduziu falhas de glm47/nemotron de 10/10 → 0/4.</text>

  <text x="68" y="372" fill="#f8fafc" font-family="monospace" font-size="13">• Exemplar vs. Regra (P2-03):</text>
  <text x="295" y="372" fill="#cbd5e1" font-family="sans-serif" font-size="13">O modelo imita o exemplar do envelope: alinhar exemplar ao parser levou p2o de 0/37 → 37/37.</text>
</svg>
